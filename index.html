<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contáctanos</title>
  
  <!-- Script de Google reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <!-- Script de EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    body {
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }
    .card {
      background: white;
      width: 450px;
      padding: 40px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      border: 1px solid #e0e0e0;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      font-weight: 500;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    label {
      font-size: 13px;
      color: #555;
      display: block;
      margin-top: 20px;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="email"], textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #ccc;
      padding: 8px 0;
      outline: none;
      font-size: 14px;
      background: transparent;
      box-sizing: border-box;
    }
    input:focus, textarea:focus {
      border-bottom: 2px solid #3b82f6;
    }
    textarea {
      resize: none;
      height: 60px;
    }
    /* Estilo para el contenedor del reCAPTCHA real */
    .g-recaptcha-container {
      margin-top: 25px;
      display: flex;
      justify-content: center;
    }
    .btn {
      margin-top: 20px;
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
    }
    .btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Contáctanos</h2>

  <form id="form">
    <div class="field">
      <label for="name">Nombre</label>
      <input type="text" name="name" id="name" required>
    </div>

    <div class="field">
      <label for="title">Título / Asunto</label>
      <input type="text" name="title" id="title" required>
    </div>

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" name="email" id="email" required>
    </div>

    <div class="field">
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" required></textarea>
    </div>

    <!-- Contenedor del reCAPTCHA oficial -->
    <div class="g-recaptcha-container">
      <div class="g-recaptcha" data-sitekey="6Lc3dAIuAAAAAHNaG0LIU84rR23Ryhv1MvvGUy7f"></div>
    </div>

    <input type="submit" class="btn" id="button" value="Enviar">
  </form>
</div>

<!-- Lógica de EmailJS -->
<script type="text/javascript">
  emailjs.init({
    publicKey: 'IE8c9l6fH3m32cZgC',
  });

  const btn = document.getElementById('button');

  document.getElementById('form').addEventListener('submit', function(event) {
    event.preventDefault();

    btn.value = 'Enviando...';

    const serviceID = 'service_jkjo366';
    const templateID = 'template_wm8mgnx';

    emailjs.sendForm(serviceID, templateID, this)
      .then(() => {
        btn.value = 'Enviar';
        alert('¡Mensaje enviado con éxito!');
        this.reset();
      }, (err) => {
        btn.value = 'Enviar';
        alert('Hubo un error: ' + JSON.stringify(err));
      });
  });
</script>

</body>
</html>
